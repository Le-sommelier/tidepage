name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # third_party/ is gitignored; the pinned upstream must be cloned before the workspace builds.
      - name: Fetch pinned upstream
        run: scripts/fetch-upstream.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -p pdfa-ffi -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Not configured yet: deny.toml and the advisory database policy are still to be written.
      - name: cargo deny
        continue-on-error: true
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Lint, unit tests, debug build
        run: ./gradlew lint test assembleDebug assembleRelease checkManifest --stacktrace

  # The release APK with the real engine inside, measured against the size limit. Separate from the
  # android job: it needs the Rust toolchain and the NDK, and runs in parallel.
  apk-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Fetches the pinned upstream, builds and strips libpdfa_ffi.so, copies it into :engine.
      - name: Build the native engine (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android.sh

      - name: Release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: APK size gate (25 MB per ABI)
        run: tools/perf/apk-size.sh 25
